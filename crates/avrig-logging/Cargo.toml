[package]
name = "avrig-logging"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared human-readable, size-rotating logging for avrig"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "json"] }

[dev-dependencies]
tempfile = "3"
